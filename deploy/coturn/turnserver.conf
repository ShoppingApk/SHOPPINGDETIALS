# coturn configuration for Kaasni calls (TURN relay).
# Secrets are NOT stored here: docker-compose.yml passes --static-auth-secret, --realm and
# --external-ip from the .env file next to it. See COTURN_SETUP.md.

# ---- Listening ----
# TURN/STUN over UDP and TCP
listening-port=3478
# TURN over TLS (only active when the certificate files below exist)
tls-listening-port=5349
# On strict networks (offices, some mobile carriers) only port 443 gets through. To serve TLS on
# 443 as well, uncomment this (nothing else on the VM may use 443):
# alt-tls-listening-port=443

# Relay ports handed out to calls. Each call uses a few. Open this UDP range in the firewall.
min-port=49160
max-port=49260

# ---- Authentication: short-lived credentials (TURN REST API) ----
# The backend signs "<expiry>:<label>" with the shared secret (HMAC-SHA1); coturn checks it.
use-auth-secret
fingerprint

# ---- TLS (optional) ----
# Put fullchain.pem and privkey.pem in ./certs (see COTURN_SETUP.md, step 9).
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-tlsv1
no-tlsv1_1

# ---- Limits (protect a small free VM) ----
# max simultaneous relay allocations on this server
total-quota=60
# max allocations per credential
user-quota=12
# max ~1.5 Mbit/s per session (plenty for 360p video + voice)
max-bps=1500000
stale-nonce=600

# ---- Security ----
no-cli
no-multicast-peers
no-software-attribute
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780
# Never relay into private/internal networks (stops the server being used to reach the VM's
# own network or cloud metadata services).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# ---- Logging (no call content is ever logged; coturn never sees decrypted media) ----
log-file=stdout
simple-log
